# To comment a line (or part of it) place a # before the text

[General]
# Path where files are being loaded from
RedirPath = /PSP/VSH

[SlidePlugin]
ClockAndCalendar = Disabled
# The darkness/lightness level for the clock; 1 is lightest, 8 is darkest
Contrast = Disabled

# Button list
# Select = 0x000001
# Start = 0x000008
# D-pad up = 0x000010
# D-pad right = 0x000020
# D-pad down = 0x000040
# D-pad left = 0x000080
# Left trigger = 0x000100
# Right trigger = 0x000200
# Triangle = 0x001000
# Circle = 0x002000
# Cross = 0x004000
# Square = 0x008000
# Home = 0x010000
# Note = 0x800000
# Screen = 0x400000
# Volume up = 0x100000
# Volume down = 0x200000

# The button to launch the clock
StartBtn = 0x010000
# The button to stop the clock
StopBtn = 0x010000

[PowerSave]

# Set to Enabled to disable LEDs with clock 
LED = Disabled

# Screen brightness between 0-100 (0 is pitch black, 100 is full brightness)
# Set to -1 for disabling
Brightness = -1

[Experimental]
# Master opt-in for controlled PSP-1000 SlidePlugin experiments
PSP1000SlidePlugin = Disabled
# Selectively force only the PSP-1000 6.61 VSH caller at text +0x58D4
PSP1000SelectiveSlideTrigger58D4 = Disabled
# Isolated PSP-1000 6.61 sceBSMan CLOSED-state experiment
PSP1000BSManClosedShim = Disabled
# Transparent activation-entry and BSMan-call-boundary localization
PSP1000ActivationTrace = Disabled
# Callsite-only natural-zero to boolean-present control for scePaf 0xED83BBCF
PSP1000PafPresentCompat = Disabled
# Callsite-only exact BSMan library-not-linked to false/closed experiment
PSP1000BSManNotLinkedCompat = Disabled
# Selectively substitute natural zero with one only at vsh_module+0x14020
PSP1000Consumer14020Compat = Disabled
# Selectively substitute natural zero with one only at vsh_module+0x13F6C
PSP1000Consumer13F6CCompat = Disabled
