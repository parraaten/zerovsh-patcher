# ZeroVSH sample configuration

[General]
# Memory Stick directory used for redirected VSH resources.
RedirPath = /PSP/VSH

[SlidePlugin]
# On PSP-1000, Enabled together with PSP1000SlidePlugin selects functional mode.
ClockAndCalendar = Disabled
# Clock contrast: 1 is lightest, 8 is darkest; Disabled keeps the default.
Contrast = Disabled

# Button masks: Select 0x000001, Start 0x000008, D-pad 0x000010-0x000080,
# L/R 0x000100/0x000200, Triangle/Circle/Cross/Square 0x001000-0x008000,
# Home 0x010000, Volume up/down 0x100000/0x200000, Screen 0x400000,
# Note 0x800000.
StartBtn = 0x010000
StopBtn = 0x010000

[PowerSave]
# Disable LEDs while the clock is open.
LED = Disabled
# Brightness from 0-100; -1 disables brightness control.
Brightness = -1

[Experimental]
# ----------------------------------------------------------------------
# PSP-1000 core
# ----------------------------------------------------------------------
# Master opt-in. With ClockAndCalendar Enabled, selects functional mode;
# functional mode selects the selective +0x58D4 trigger internally.
PSP1000SlidePlugin = Disabled

# Explicit trigger selector for controlled non-functional/diagnostic experiments.
# Functional mode does not require DangerousCaller58D4 here.
PSP1000SlideTriggerMode = Disabled

# Writes ms0:/zerovsh_psp1000.log when Enabled.
PSP1000Diagnostics = Disabled

# Legacy / deprecated compatibility alias; retained while the parser accepts it.
PSP1000SelectiveSlideTrigger58D4 = Disabled

# ----------------------------------------------------------------------
# Diagnostics and trigger selection
# ----------------------------------------------------------------------
PSP1000SonyStartTrace = Disabled
PSP1000ActivationTrace = Disabled
PSP1000ActivationWideTrace = Disabled

# ----------------------------------------------------------------------
# Functional compatibility controls
# ----------------------------------------------------------------------
PSP1000BSManClosedShim = Disabled
PSP1000PafPresentCompat = Disabled
PSP1000BSManNotLinkedCompat = Disabled
PSP1000Consumer14020Compat = Disabled
PSP1000Consumer13F6CCompat = Disabled
PSP1000PafCapabilityMaskCompat = Disabled
PSP1000StateZero15To14Compat = Disabled
PSP1000ImposeParam8000000DCompat = Disabled

# ----------------------------------------------------------------------
# Legacy / diagnostic-only experiments
# ----------------------------------------------------------------------
PSP1000PostImposeVCallTrace = Disabled
PSP1000PostMinusOneVCall64Trace = Disabled
PSP1000PostVCall64CollectionTrace = Disabled
PSP1000CollectionPafFCF265D8Trace = Disabled
PSP1000CollectionPaf9A285882Trace = Disabled
PSP1000PostCollectionPafFCF265D8Trace = Disabled
PSP1000MaskedPafC59FC3D0Trace = Disabled
PSP1000MaskedPafC59FC3D0SecondTrace = Disabled
